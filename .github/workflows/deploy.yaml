name: Deploy (On-Demand)

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Which service to deploy?"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "backend"
          - "frontend"
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        default: "production"
        options:
          - "production"
          - "staging"
      update_compose:
        description: "Pin new image tags in server/docker-compose .env on the host?"
        required: true
        type: boolean
        default: true

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_NAMESPACE: srinathn2212

jobs:
  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.service == 'backend' || github.event.inputs.service == 'all' }}
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      full_image: ${{ steps.tag.outputs.full_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="v${{ github.run_number }}-${SHORT_SHA}"
          IMAGE="${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/voyara-backend:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.full_image }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/voyara-backend:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/voyara-backend:${{ github.event.inputs.environment }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.service == 'frontend' || github.event.inputs.service == 'all' }}
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      full_image: ${{ steps.tag.outputs.full_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="v${{ github.run_number }}-${SHORT_SHA}"
          IMAGE="${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/voyara-frontend:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ${{ steps.tag.outputs.full_image }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/voyara-frontend:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/voyara-frontend:${{ github.event.inputs.environment }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: |
      always() &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') &&
      !(needs.build-backend.result == 'skipped' && needs.build-frontend.result == 'skipped')
    steps:
      - name: SSH and roll
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVICE: ${{ github.event.inputs.service }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          UPDATE_COMPOSE: ${{ github.event.inputs.update_compose }}
          BACKEND_IMAGE: ${{ needs.build-backend.outputs.full_image }}
          FRONTEND_IMAGE: ${{ needs.build-frontend.outputs.full_image }}
          IMAGE_TAG: ${{ needs.build-backend.outputs.image_tag || needs.build-frontend.outputs.image_tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: SERVICE,ENVIRONMENT,UPDATE_COMPOSE,BACKEND_IMAGE,FRONTEND_IMAGE,IMAGE_TAG
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "=== Deploy: service=${SERVICE} env=${ENVIRONMENT} ==="

            # server/.env is the canonical pinning point for image tags.
            BACKUP=".env.backup-$(date +%Y%m%d-%H%M%S)"
            cp .env "$BACKUP"
            echo "Backed up .env -> $BACKUP"

            if [ "$UPDATE_COMPOSE" = "true" ]; then
              if [ "$SERVICE" = "all" ] || [ "$SERVICE" = "backend" ]; then
                if [ -n "${BACKEND_IMAGE:-}" ]; then
                  sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${BACKEND_IMAGE}|" .env
                  echo "Pinned BACKEND_IMAGE=${BACKEND_IMAGE}"
                fi
              fi
              if [ "$SERVICE" = "all" ] || [ "$SERVICE" = "frontend" ]; then
                if [ -n "${FRONTEND_IMAGE:-}" ]; then
                  sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=${FRONTEND_IMAGE}|" .env
                  echo "Pinned FRONTEND_IMAGE=${FRONTEND_IMAGE}"
                fi
              fi
            fi

            # Load .env into the current shell so docker compose sees the new tags.
            set -a; . ./.env; set +a

            echo "=== Pulling images ==="
            if [ "$SERVICE" = "all" ]; then
              docker compose pull backend frontend
            else
              docker compose pull "$SERVICE"
            fi

            echo "=== Restarting ==="
            if [ "$SERVICE" = "all" ]; then
              docker compose up -d --force-recreate --no-deps backend frontend
            else
              docker compose up -d --force-recreate --no-deps "$SERVICE"
            fi

            echo "=== Waiting for /actuator/health ==="
            for i in $(seq 1 30); do
              if curl -sf -o /dev/null http://127.0.0.1/actuator/health; then
                echo "Healthy after ${i}s"
                break
              fi
              sleep 2
            done

            echo "=== Status ==="
            docker compose ps

            echo "=== Cleaning up old images ==="
            docker image prune -af

            ls -t .env.backup-* 2>/dev/null | tail -n +11 | xargs -r rm
            echo "Done."

      - name: Summary
        run: |
          {
            echo "## Deployment summary"
            echo
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Service | ${{ github.event.inputs.service }} |"
            echo "| Environment | ${{ github.event.inputs.environment }} |"
            echo "| Update compose | ${{ github.event.inputs.update_compose }} |"
            echo "| Image tag | \`${{ needs.build-backend.outputs.image_tag || needs.build-frontend.outputs.image_tag }}\` |"
            echo
            echo "### Images"
            if [ "${{ github.event.inputs.service }}" = "all" ] || [ "${{ github.event.inputs.service }}" = "backend" ]; then
              echo "- backend: \`${{ needs.build-backend.outputs.full_image }}\`"
            fi
            if [ "${{ github.event.inputs.service }}" = "all" ] || [ "${{ github.event.inputs.service }}" = "frontend" ]; then
              echo "- frontend: \`${{ needs.build-frontend.outputs.full_image }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
