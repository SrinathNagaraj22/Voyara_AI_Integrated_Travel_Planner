# Local development stack: Postgres only.
# The backend itself runs via `npm run dev:backend`. The frontend runs via `npm run dev`.
# For a full containerized run, see docker-compose.prod.yml.
services:
  postgres:
    image: postgres:16-alpine
    container_name: voyara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voyara}
      POSTGRES_USER: ${POSTGRES_USER:-voyara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voyara}
    ports:
      - "5432:5432"
    volumes:
      - voyara-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voyara} -d ${POSTGRES_DB:-voyara}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  voyara-pgdata:
