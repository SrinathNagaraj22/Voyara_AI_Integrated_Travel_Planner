events {}

http {
  upstream backend_app { least_conn; server backend:8080; }

  # EC2 box only hosts the API; frontend lives on Netlify and proxies here.
  # The /api/ prefix is preserved (Spring controllers already include it).
  server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 25m;

    # Defense-in-depth headers. The browser will get the response via the
    # Netlify proxy, but a direct curl against the box still benefits.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
      proxy_pass http://backend_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Netlify already terminates TLS upstream; pretend the original scheme
      # was HTTPS so Spring sees an HTTPS request and Set-Cookie Secure works.
      proxy_set_header X-Forwarded-Proto https;
    }

    location /actuator/health {
      proxy_pass http://backend_app;
      proxy_set_header Host $host;
    }

    # Nothing else lives here — frontend is on Netlify.
    location / {
      return 404 "voyara-api: see https://<your>.netlify.app for the frontend\n";
      default_type text/plain;
    }
  }
}
