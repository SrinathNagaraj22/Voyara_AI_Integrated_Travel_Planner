services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: voyara-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080

      # Managed Postgres (RDS / Neon / Supabase / etc.) — full JDBC URL.
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      # JWT signing — set to a fresh 48+ char value via `openssl rand -base64 48`.
      VOYARA_JWT_SECRET: ${VOYARA_JWT_SECRET}
      VOYARA_JWT_EXPIRATION_MS: ${VOYARA_JWT_EXPIRATION_MS:-86400000}

      # Cookie hardening. IP-only deploy = no HTTPS = Secure must be false
      # (Set-Cookie; Secure is dropped by browsers over plain HTTP).
      # Flip to true the moment you put a real domain + TLS in front.
      VOYARA_COOKIE_SECURE: ${VOYARA_COOKIE_SECURE:-false}
      VOYARA_COOKIE_SAMESITE: ${VOYARA_COOKIE_SAMESITE:-Lax}

      # CORS — must match the public origin the browser sees, exactly.
      # For an IP-only deploy this is typically http://<public-ip>.
      VOYARA_CORS_ORIGINS: ${VOYARA_CORS_ORIGINS}

      # Sign-in with Google (optional). Leave empty to disable.
      VOYARA_GOOGLE_CLIENT_ID: ${VOYARA_GOOGLE_CLIENT_ID:-}

      # Gemini AI (optional). Falls back to a canned itinerary if empty.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      JAVA_OPTS: ${JAVA_OPTS:-}
    expose:
      - "8080"
    networks:
      - voyara-net

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: voyara-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "8080"
    networks:
      - voyara-net

  nginx:
    image: nginx:1.27-alpine
    container_name: voyara-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/current.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - voyara-net

networks:
  voyara-net:
    driver: bridge
