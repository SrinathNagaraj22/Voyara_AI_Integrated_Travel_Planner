# Dev profile: local Postgres (via docker-compose.yml), Flyway-managed schema,
# DataSeeder inserts demo rows on first boot.
#
# Start the database first:
#   docker compose up -d postgres
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/voyara}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:voyara}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:voyara}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway owns the schema; Hibernate only validates entity ↔ table alignment.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
