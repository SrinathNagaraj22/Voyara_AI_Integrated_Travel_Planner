# Prod profile: Postgres + Flyway migrations. All settings come from env vars.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/voyara}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:voyara}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Schema is owned by Flyway; Hibernate must not touch it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Cookies must be Secure under HTTPS in prod (override via env if behind a TLS-terminating proxy).
voyara.auth.cookie.secure=${VOYARA_COOKIE_SECURE:true}
voyara.auth.cookie.same-site=${VOYARA_COOKIE_SAMESITE:Lax}
