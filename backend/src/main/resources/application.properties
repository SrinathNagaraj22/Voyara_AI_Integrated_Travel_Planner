# ===================================================================
# Voyara backend defaults. Profile-specific overrides live in
#   application-dev.properties (default), application-test.properties,
#   application-prod.properties
# Override any value via environment variables in production.
# ===================================================================
server.port=${SERVER_PORT:8080}
spring.application.name=voyara-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 console is permanently disabled (dev uses curl/HTTP API instead)
spring.h2.console.enabled=false

# Auth
voyara.jwt.secret=${VOYARA_JWT_SECRET:dev-only-secret-please-override-in-production-min-32-chars}
voyara.jwt.expiration-ms=${VOYARA_JWT_EXPIRATION_MS:86400000}
voyara.auth.cookie.secure=${VOYARA_COOKIE_SECURE:false}
voyara.auth.cookie.same-site=${VOYARA_COOKIE_SAMESITE:Lax}

# CORS
voyara.cors.allowed-origins=${VOYARA_CORS_ORIGINS:http://localhost:3000}

# Sign in with Google (leave empty to disable)
voyara.google.client-id=${VOYARA_GOOGLE_CLIENT_ID:}

# Gemini
voyara.gemini.api-key=${GEMINI_API_KEY:}
voyara.gemini.api-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent}

# Actuator: only health + info publicly exposed
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false
