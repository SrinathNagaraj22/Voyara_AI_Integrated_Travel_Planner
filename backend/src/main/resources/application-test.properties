# Test profile: isolated in-memory H2 with predictable schema, no seed data.
spring.datasource.url=jdbc:h2:mem:voyaratest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

voyara.jwt.secret=test-secret-for-integration-tests-must-be-32-chars-or-longer
voyara.jwt.expiration-ms=3600000
voyara.auth.cookie.secure=false
voyara.auth.cookie.same-site=Lax
voyara.cors.allowed-origins=http://localhost:3000
